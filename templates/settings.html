<!DOCTYPE html>
<html lang="en"
      data-theme="{{ settings.theme }}"
      style="--reader-font-family: {{ settings.font_family_css }};
             --reader-font-size-base: {{ settings.font_size }}rem;
             {% if settings.theme == 'custom' %} --bg-color: {{ settings.custom_bg_color }};
             --surface-color: {{ settings.custom_surface_color }};
             --text-color: {{ settings.custom_text_color }};
             --text-muted: {{ settings.custom_text_muted }};
             --border-color: {{ settings.custom_border_color }};
             --accent-color: {{ settings.custom_accent_color }};
             --accent-hover: {{ settings.custom_accent_hover }};
             {% endif %}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Settings — shelf-mg</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <div class="reader-header">
            <div class="header-top">
                <div class="header-left">
                    <a href="{{ url_for('library_list') }}">&larr; Back to library</a>
                </div>
                <div class="header-right"></div>
            </div>
            <h1 class="library-title header-title">Settings</h1>
        </div>
        <form method="post" class="settings-form">
            <div class="settings-field">
                <label for="theme">Theme</label>
                <select id="theme" name="theme" onchange="previewTheme(this.value)">
                    {% for choice in theme_choices %}
                        <option value="{{ choice }}"
                                {% if choice == settings.theme %}selected{% endif %}>{{ choice | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <div id="custom-color-fields"
                 class="custom-color-fields"
                 style="display: {{ 'block' if settings.theme == 'custom' else 'none' }}">
                <div class="settings-field">
                    <label for="custom_bg_color">Background</label>
                    <input type="color"
                           id="custom_bg_color"
                           name="custom_bg_color"
                           value="{{ settings.custom_bg_color }}"
                           oninput="previewCustomColors()">
                </div>
                <div class="settings-field">
                    <label for="custom_surface_color">Surface</label>
                    <input type="color"
                           id="custom_surface_color"
                           name="custom_surface_color"
                           value="{{ settings.custom_surface_color }}"
                           oninput="previewCustomColors()">
                </div>
                <div class="settings-field">
                    <label for="custom_text_color">Text</label>
                    <input type="color"
                           id="custom_text_color"
                           name="custom_text_color"
                           value="{{ settings.custom_text_color }}"
                           oninput="previewCustomColors()">
                </div>
                <div class="settings-field">
                    <label for="custom_text_muted">Muted text</label>
                    <input type="color"
                           id="custom_text_muted"
                           name="custom_text_muted"
                           value="{{ settings.custom_text_muted }}"
                           oninput="previewCustomColors()">
                </div>
                <div class="settings-field">
                    <label for="custom_border_color">Border</label>
                    <input type="color"
                           id="custom_border_color"
                           name="custom_border_color"
                           value="{{ settings.custom_border_color }}"
                           oninput="previewCustomColors()">
                </div>
                <div class="settings-field">
                    <label for="custom_accent_color">Accent</label>
                    <input type="color"
                           id="custom_accent_color"
                           name="custom_accent_color"
                           value="{{ settings.custom_accent_color }}"
                           oninput="previewCustomColors()">
                </div>
                <div class="settings-field">
                    <label for="custom_accent_hover">Accent (hover)</label>
                    <input type="color"
                           id="custom_accent_hover"
                           name="custom_accent_hover"
                           value="{{ settings.custom_accent_hover }}"
                           oninput="previewCustomColors()">
                </div>
            </div>
            <div class="settings-field">
                <label for="font_family">Font</label>
                <select id="font_family"
                        name="font_family"
                        onchange="previewFont(this.value)">
                    {% for key, css_value in font_choices.items() %}
                        <option value="{{ key }}"
                                data-css="{{ css_value }}"
                                {% if key == settings.font_family_key %}selected{% endif %}>{{ key | capitalize }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="settings-field">
                <label for="font_size">Font size (<span id="font-size-label">{{ settings.font_size }}</span>rem)</label>
                <input type="range"
                       id="font_size"
                       name="font_size"
                       min="0.7"
                       max="2.5"
                       step="0.1"
                       value="{{ settings.font_size }}"
                       oninput="previewFontSize(this.value)">
            </div>
            <div class="settings-field">
                <label>
                    <input type="checkbox"
                           id="override_epub_font"
                           name="override_epub_font"
                           {% if settings.override_epub_font %}checked{% endif %}
                           onchange="toggleReaderFontFields(this.checked)">
                    Override story's font
                </label>
            </div>
            <div id="reader-font-fields"
                 style="display: {{ 'block' if settings.override_epub_font else 'none' }}">
                <div class="settings-field">
                    <label for="reader_font_family">Reader font</label>
                    <select id="reader_font_family"
                            name="reader_font_family"
                            onchange="previewReaderFont(this.value)">
                        {% for key, css_value in font_choices.items() %}
                            <option value="{{ key }}"
                                    data-css="{{ css_value }}"
                                    {% if key == settings.reader_font_family_key %}selected{% endif %}>{{ key | capitalize }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="settings-field">
                    <label for="reader_font_size">Reader font size (<span id="reader-font-size-label">{{ settings.reader_font_size }}</span>rem)</label>
                    <input type="range"
                           id="reader_font_size"
                           name="reader_font_size"
                           min="0.7"
                           max="2.5"
                           step="0.1"
                           value="{{ settings.reader_font_size }}"
                           oninput="previewReaderFontSize(this.value)">
                </div>
            </div>
            <div class="preview-row">
                <div class="settings-preview" id="settings-preview">
                    <p class="preview-body">Preview: the quick brown fox jumps over the lazy dog.</p>
                    <p class="preview-muted">Muted text example</p>
                    <a href="#" class="preview-link" onclick="return false;">A sample link</a>
                    <button type="button" class="preview-button">Sample button</button>
                </div>
                <div class="settings-preview"
                     id="reader-font-preview"
                     style="display: {{ 'block' if settings.override_epub_font else 'none' }};
                            --reader-font-family: {{ settings.reader_font_family_css }};
                            --reader-font-size-base: {{ settings.reader_font_size }}rem">
                    <p class="preview-reader-label">Reading area</p>
                    <p class="preview-body"><em>His AC touches down, metal sparking against the floor.</em> "Looks like the guest of honor's here. <strong>Hey, Buddy.</strong>"</p>
                </div>
            </div>
            <button type="submit" class="settings-save">Save</button>
        </form>
        <script src="{{ url_for('static', filename='settings-preview.js') }}"></script>
    </body>
</html>
