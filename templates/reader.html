<!DOCTYPE html>
<html lang="en"
      data-theme="{{ settings.theme }}"
      style="--reader-font-family: {{ settings.font_family_css }};
             --reader-font-size-base: {{ settings.font_size }}rem;
             --content-max-width-vw: {{ settings.content_max_width_pct }}vw;
             {% if settings.theme == 'custom' %} --bg-color: {{ settings.custom_bg_color }};
             --surface-color: {{ settings.custom_surface_color }};
             --text-color: {{ settings.custom_text_color }};
             --text-muted: {{ settings.custom_text_muted }};
             --border-color: {{ settings.custom_border_color }};
             --accent-color: {{ settings.custom_accent_color }};
             --accent-hover: {{ settings.custom_accent_hover }};
             {% endif %}">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ book.title }} — {{ chapter.title }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body data-book-id="{{ book.id }}"
          data-chapter-index="{{ chapter.index }}"
          {% if restore_scroll_percent is not none %}data-restore-scroll="{{ restore_scroll_percent }}"{% endif %}>
        {% macro chapter_nav() %}
            <nav class="chapter-nav">
                <span>
                    {% if prev_index is not none %}
                        <a href="/read/{{ book.id }}/{{ prev_index }}">&larr; Previous</a>
                    {% endif %}
                </span>
                <span>
                    {% if next_index is not none %}
                        <a href="/read/{{ book.id }}/{{ next_index }}">Next &rarr;</a>
                    {% endif %}
                </span>
            </nav>
        {% endmacro %}
        <div class="reader-header">
            <div class="header-top">
                <div class="header-left">
                    <a href="/">&larr; Back to library</a>
                </div>
                <div class="header-right">
                    <a class="theme-toggle" href="/settings">Settings</a>
                </div>
            </div>
            <h1 class="header-title">{{ book.title }}</h1>
            <select class="chapter-select"
                    onchange="location.href='/read/{{ book.id }}/' + this.value">
                {% for c in chapters %}
                    <option value="{{ c.index }}"
                            {% if c.index == chapter.index %}selected{% endif %}>{{ c.title }}</option>
                {% endfor %}
            </select>
        </div>
        {{ chapter_nav() }}
        <iframe id="chapter-frame"
                class="chapter-frame"
                src="/read/{{ book.id }}/{{ chapter.index }}/frame"
                scrolling="no"
                title="{{ chapter.title }}"></iframe>
        {{ chapter_nav() }}
        <script>
            (function () {
            const bookId = document.body.dataset.bookId;
            const chapterIndex = document.body.dataset.chapterIndex;
            const restoreScroll = document.body.dataset.restoreScroll;
            const iframe = document.getElementById("chapter-frame");

            window.addEventListener("message", (event) => {
                if (event.origin !== window.location.origin) return;
                if (event.data && event.data.type === "shelf-mg-frame-height") {
                iframe.style.height = event.data.height + "px";

                if (restoreScroll !== undefined && !window._shelfMgRestored) {
                    window._shelfMgRestored = true;
                    const maxScroll = document.body.scrollHeight - window.innerHeight;
                    window.scrollTo(0, maxScroll * parseFloat(restoreScroll));
                }
                }
            });

            function currentScrollPercent() {
                const maxScroll = document.body.scrollHeight - window.innerHeight;
                if (maxScroll <= 0) return 0;
                return Math.min(1, Math.max(0, window.scrollY / maxScroll));
            }

            function savePosition() {
                const payload = JSON.stringify({
                chapter_index: parseInt(chapterIndex, 10),
                scroll_percent: currentScrollPercent(),
                });
                if (navigator.sendBeacon) {
                navigator.sendBeacon(
                    `/api/position/${bookId}`,
                    new Blob([payload], { type: "application/json" })
                );
                } else {
                fetch(`/api/position/${bookId}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: payload,
                    keepalive: true,
                });
                }
            }

            let scrollTimeout;
            window.addEventListener("scroll", () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(savePosition, 1000);
            });

            window.addEventListener("beforeunload", savePosition);
            })();
        </script>
    </body>
</html>
