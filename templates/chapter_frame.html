<!DOCTYPE html>
<html lang="en"
      data-theme="{{ settings.theme }}"
      style="--reader-font-family: {{ settings.font_family_css }};
             --reader-font-size: {{ settings.font_size }}rem">
    <head>
        <meta charset="utf-8">
        <title>{{ chapter_title }}</title>
        <!-- Same stylesheet as the outer page — single source of truth for
       colors/typography. Theme and font now come from settings.py,
       rendered server-side directly into the <html> tag above — no more
       client-side JS reaching into the parent document to read its theme;
       since settings are stored server-side now (not localStorage), this
       document can just render the correct values itself from the start. -->
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <style>{{ css | safe }}</style>
    </head>
    <body>
        {{ content | safe }}
        <script>
            function reportHeight() {
            const height = document.documentElement.scrollHeight;
            parent.postMessage({ type: "shelf-mg-frame-height", height: height }, window.location.origin);
            }
            window.addEventListener("load", reportHeight);
            window.addEventListener("load", () => setTimeout(reportHeight, 300));
        </script>
    </body>
</html>
