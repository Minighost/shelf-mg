<!DOCTYPE html>
<html lang="en"
      data-theme="{{ settings.theme }}"
      style="--reader-font-family: {{ settings.reader_font_family_css if settings.override_epub_font else settings.font_family_css }};
             --reader-font-size-base: {{ (settings.reader_font_size if settings.override_epub_font else settings.font_size) }}rem;
             {% if settings.theme == 'custom' %} --bg-color: {{ settings.custom_bg_color }};
             --surface-color: {{ settings.custom_surface_color }};
             --text-color: {{ settings.custom_text_color }};
             --text-muted: {{ settings.custom_text_muted }};
             --border-color: {{ settings.custom_border_color }};
             --accent-color: {{ settings.custom_accent_color }};
             --accent-hover: {{ settings.custom_accent_hover }};
             {% endif %}">
    <head>
        <meta charset="utf-8">
        <title>{{ chapter_title }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <style>
            body { padding: 0; }
        </style>
        <style>{{ css | safe }}</style>
        {% if settings.override_epub_font %}
            <style>
                body, body * {
                    font-family: var(--reader-font-family) !important;
                    font-size: var(--reader-font-size) !important;
                }
            </style>
        {% endif %}
    </head>
    <body>
        {{ content | safe }}
        <script>
            function reportHeight() {
            const height = document.documentElement.scrollHeight;
            parent.postMessage({ type: "shelf-mg-frame-height", height: height }, window.location.origin);
            }
            window.addEventListener("load", reportHeight);
            window.addEventListener("load", () => setTimeout(reportHeight, 300));
        </script>
    </body>
</html>
